<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Investigación Fantasma</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#DD9100">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasma">
<meta name="description" content="Detección paranormal de voz — cámara, grabación y bitácora.">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --orange:#DD9100; --orange-d:#C67E00; --dark:#292929; --red:#FF0000; --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(120% 120% at 50% 0%, var(--orange-d) 0%, #8A5A00 100%);
    font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--dark);
    display:grid;place-items:center;min-height:100dvh;overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;} }

  #stage{transform-origin:center center;}

  .phone{
    position:relative;width:390px;height:844px;border-radius:38px;overflow:hidden;
    background:linear-gradient(180deg,var(--orange) 0%,var(--orange-d) 100%);color:var(--dark);
    box-shadow:0 40px 80px -20px rgba(0,0,0,.5),0 0 0 10px var(--dark),0 0 0 12px rgba(255,255,255,.06);
  }
  .screen{position:absolute;inset:0;display:none;flex-direction:column;}
  .screen.on{display:flex;}

  @keyframes recPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.82);}}
  @keyframes softIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes dropIn{from{transform:translateY(-102%);}to{transform:translateY(0);}}
  @keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,0,0,.55);}50%{box-shadow:0 0 0 10px rgba(255,0,0,0);}}

  .pill-sim{position:absolute;top:15px;left:50%;transform:translateX(-50%);z-index:6;display:inline-flex;align-items:center;gap:6px;font-size:9px;font-weight:700;letter-spacing:.14em;border-radius:999px;padding:5px 12px;cursor:pointer;border:1.5px solid var(--dark);user-select:none;}
  .pill-sim .dot{width:7px;height:7px;border-radius:50%;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-top:2px;}
  .burger{width:34px;height:26px;background:var(--dark);border-radius:6px;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 8px;cursor:pointer;}
  .burger span{height:2px;background:var(--orange);border-radius:2px;}
  .lang-btn{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--dark);border:1.5px solid var(--dark);border-radius:999px;padding:5px 11px;cursor:pointer;user-select:none;}

  .cam-wrap{display:flex;justify-content:center;margin-top:24px;}
  .cam{position:relative;width:256px;height:256px;border-radius:50%;overflow:hidden;background:var(--orange);border:6px solid var(--dark);box-shadow:0 18px 34px -14px rgba(0,0,0,.55);}
  .cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;}
  .cam canvas.sim{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .cam .recring{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 4px var(--red);pointer-events:none;}
  .cam .prompt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;background:var(--orange);}
  .cam-icon{position:relative;width:84px;height:60px;background:var(--dark);border-radius:11px;}
  .cam-icon .lens{position:absolute;top:-9px;left:23px;width:26px;height:11px;background:var(--dark);border-radius:5px 5px 0 0;}
  .cam-icon .ring{position:absolute;inset:0;margin:auto;width:30px;height:30px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px var(--dark);}
  .cam-icon .pupil{position:absolute;inset:0;margin:auto;width:12px;height:12px;border-radius:50%;background:var(--dark);}
  .prompt-txt{font-size:10px;letter-spacing:.1em;color:var(--dark);text-align:center;max-width:160px;font-weight:600;}

  .timer-wrap{display:flex;justify-content:center;margin-top:-18px;}
  .timer{display:inline-flex;align-items:center;gap:9px;background:var(--dark);color:var(--white);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:700;letter-spacing:.08em;box-shadow:0 8px 18px -8px rgba(0,0,0,.55);z-index:2;}
  .timer .tnum{font-variant-numeric:tabular-nums;}
  .timer .rdot{width:10px;height:10px;border-radius:50%;}
  .timer .rdot.rec{background:var(--red);animation:recPulse 1s infinite;}
  .timer .rdot.idle{background:rgba(255,255,255,.35);}

  .lower{flex:1;padding:0 0 0;}
  .lower-row{display:flex;align-items:flex-end;gap:16px;padding:0 0 0;}
  .viz{width:100%;height:44px;display:block;}
  .label{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--white);margin:9px 0 7px;}
  .interim{font-size:12px;font-style:italic;color:rgba(247,239,221,.65);margin-bottom:4px;}
  .phrase-main{margin-bottom:5px;}
  .phrase-main .t{font-size:14px;font-weight:700;color:var(--white);line-height:1.3;}
  .phrase-main .m{font-size:9px;font-weight:600;color:rgba(255,255,255,.78);margin-top:1px;font-variant-numeric:tabular-nums;}
  .phrase-main.p1{opacity:.55;} .phrase-main.p1 .t{font-size:13px;font-weight:400;}
  .phrase-main.p2{opacity:.32;} .phrase-main.p2 .t{font-size:13px;font-weight:400;}
  .phrase-main.p0{animation:softIn .25s;}
  .empty{font-size:12px;color:rgba(247,239,221,.5);}

  .ctrls{display:flex;flex-direction:column;gap:13px;align-items:center;}
  .rec-btn{width:60px;height:60px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 18px -6px rgba(255,0,0,.6);border:none;}
  .rec-btn.active{box-shadow:0 0 0 5px rgba(255,0,0,.3),0 0 22px rgba(255,0,0,.55);}
  .rec-btn .sq{width:22px;height:22px;border-radius:5px;background:var(--white);}
  .rec-btn .ci{width:24px;height:24px;border-radius:50%;border:3px solid var(--white);}
  .mic-btn{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 14px -6px rgba(0,0,0,.5);border:none;background:var(--dark);color:var(--white);}
  .mic-btn.on{background:var(--orange);color:var(--dark);}

  .cam-error{font-size:10px;color:var(--white);border-radius:8px;padding:8px 10px;margin-bottom:12px;line-height:1.4;background:var(--dark);}

  /* menu */
  .menu-layer{position:absolute;inset:0;z-index:40;display:none;}
  .menu-layer.on{display:block;}
  .menu-scrim{position:absolute;inset:0;background:rgba(41,41,41,.55);}
  .menu-panel{position:absolute;top:0;left:0;right:0;max-height:100%;overflow-y:auto;background:var(--orange);border-radius:0 0 26px 26px;padding:22px 20px 24px;box-shadow:0 24px 44px -12px rgba(0,0,0,.6);animation:dropIn .28s cubic-bezier(.2,.8,.2,1);}
  .menu-head{display:flex;align-items:flex-start;justify-content:space-between;}
  .menu-title{font-size:16px;font-weight:800;line-height:1.15;max-width:210px;}
  .menu-sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(41,41,41,.55);margin-top:4px;}
  .menu-x{width:32px;height:32px;background:var(--dark);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--orange);font-size:15px;font-weight:800;line-height:1;}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:22px;}
  .mcard{background:var(--white);border-radius:12px;padding:14px 10px;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;box-shadow:0 8px 16px -10px rgba(0,0,0,.4);}
  .mcard .mlabel{font-size:11px;font-weight:700;line-height:1.2;}
  .ic-video{width:16px;height:12px;border:2px solid var(--dark);border-radius:3px;position:relative;}
  .ic-video::after{content:"";position:absolute;right:-6px;top:1px;border-left:6px solid var(--dark);border-top:3px solid transparent;border-bottom:3px solid transparent;}
  .ic-audio{display:flex;align-items:flex-end;gap:2px;height:13px;}
  .ic-audio span{width:3px;background:var(--dark);}
  .ic-log{display:flex;flex-direction:column;gap:2px;}
  .ic-log span{height:2px;background:var(--dark);}
  .panic-card{margin-top:12px;background:var(--white);border:1.5px solid rgba(255,0,0,.55);border-radius:12px;padding:16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
  .panic-card .pt{font-size:14px;font-weight:800;color:var(--red);}
  .panic-card .ps{font-size:10px;color:rgba(41,41,41,.5);margin-top:2px;}
  .panic-card .pi{width:26px;height:26px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;}
  .panic-card .pi span{width:11px;height:11px;background:var(--white);border-radius:2px;}
  .row-card{margin-top:11px;background:var(--white);border-radius:12px;padding:16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
  .row-card .rt{font-size:14px;font-weight:700;}
  .row-card .chev{font-size:16px;color:rgba(41,41,41,.4);}
  .lang-card{margin-top:11px;background:var(--dark);color:var(--white);border-radius:12px;padding:16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
  .lang-card .lt{font-size:14px;font-weight:700;}
  .lang-card .ls{font-size:10px;color:rgba(255,255,255,.55);margin-top:2px;}
  .lang-card .lb{font-size:12px;font-weight:800;letter-spacing:.08em;background:var(--orange);color:var(--dark);border-radius:999px;padding:5px 11px;}
  .ver{display:flex;align-items:baseline;gap:10px;margin-top:18px;}
  .ver .v1{font-size:11px;font-weight:700;color:rgba(41,41,41,.7);}
  .ver .v2{font-size:11px;font-weight:700;color:var(--dark);}

  /* sub screens */
  .sub{padding:26px 20px 20px;overflow-y:auto;}
  .sub-head{display:flex;align-items:center;gap:12px;}
  .back{font-size:18px;font-weight:800;cursor:pointer;width:30px;}
  .sub-title{font-size:17px;font-weight:800;flex:1;}
  .sect-lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(41,41,41,.55);margin:24px 0 10px;}
  .opt{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1.5px solid rgba(41,41,41,.15);cursor:pointer;}
  .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--dark);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .radio .fill{width:10px;height:10px;border-radius:50%;background:var(--dark);display:none;}
  .opt.sel .radio .fill{display:block;}
  .opt .otext{font-size:14px;font-weight:600;}

  /* bitacora */
  .bit-meta{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
  .bit-count{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(41,41,41,.55);}
  .bit-clear{font-size:11px;font-weight:700;color:var(--red);cursor:pointer;}
  .bit-list{margin-top:12px;flex:1;overflow-y:auto;background:var(--white);border-radius:14px;padding:8px;}
  .bit-empty{padding:26px 14px;text-align:center;font-size:12px;color:rgba(41,41,41,.45);line-height:1.5;}
  .bit-item{display:flex;gap:11px;padding:11px 10px;border-bottom:1px solid rgba(41,41,41,.09);}
  .bit-item .bl{font-size:10px;font-weight:700;color:var(--red);min-width:26px;}
  .bit-item .bt{font-size:13px;font-weight:600;color:var(--dark);line-height:1.35;}
  .bit-item .bm{font-size:10px;font-weight:600;color:rgba(41,41,41,.55);margin-top:3px;font-variant-numeric:tabular-nums;}

  /* modals */
  .modal{position:absolute;inset:0;background:rgba(41,41,41,.72);display:none;align-items:center;justify-content:center;padding:26px;z-index:20;}
  .modal.on{display:flex;}
  .modal-card{background:var(--white);border-radius:18px;padding:24px 22px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);}
  .bang{width:46px;height:46px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;margin-bottom:16px;animation:ringPulse 1.6s infinite;}
  .bang span{color:var(--white);font-size:24px;font-weight:800;}
  .modal-title{font-size:18px;font-weight:800;color:var(--dark);}
  .modal-body{font-size:12px;color:rgba(41,41,41,.65);line-height:1.5;margin-top:8px;}
  .btn-danger{margin-top:20px;background:var(--red);color:var(--white);border-radius:11px;padding:14px;text-align:center;font-size:14px;font-weight:800;cursor:pointer;}
  .btn-ghost{margin-top:9px;background:transparent;border:1.5px solid rgba(41,41,41,.3);color:var(--dark);border-radius:11px;padding:13px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-dark{margin-top:20px;background:var(--dark);color:var(--white);border-radius:11px;padding:13px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;}

  .toast{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:var(--dark);color:var(--white);font-size:12px;font-weight:600;padding:11px 18px;border-radius:999px;box-shadow:0 12px 24px -10px rgba(0,0,0,.6);z-index:30;animation:softIn .25s;white-space:nowrap;display:none;}
  .toast.on{display:block;}

  .main-pad{padding:24px 22px 26px;height:100%;display:flex;flex-direction:column;}

  /* ===== Device mode: real phone / installed app fills the whole screen ===== */
  body.device{background:linear-gradient(180deg,var(--orange) 0%,var(--orange-d) 100%);place-items:stretch;}
  body.device #stage{transform:none!important;width:100%;height:100dvh;}
  body.device .phone{
    width:100%;height:100dvh;border-radius:0;
    box-shadow:none;background:linear-gradient(180deg,var(--orange) 0%,var(--orange-d) 100%);
  }
  body.device .main-pad{
    padding-top:calc(20px + env(safe-area-inset-top));
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
    padding-left:calc(22px + env(safe-area-inset-left));
    padding-right:calc(22px + env(safe-area-inset-right));
  }
  body.device .sub{
    padding-top:calc(20px + env(safe-area-inset-top));
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
  }
  body.device .menu-panel{padding-top:calc(22px + env(safe-area-inset-top));}
  body.device .pill-sim{top:calc(12px + env(safe-area-inset-top));}
  body.device .toast{bottom:calc(24px + env(safe-area-inset-bottom));}
  /* On tall phones, let the content breathe and center the camera nicely */
  body.device .cam-wrap{margin-top:min(6vh,44px);}
  body.device .lower{display:flex;flex-direction:column;justify-content:flex-end;}

  /* stt status */
  .stt{font-size:10px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.85);margin:-2px 0 6px;display:none;align-items:center;gap:6px;}
  .stt.on{display:flex;}
  .stt .sd{width:7px;height:7px;border-radius:50%;background:var(--red);animation:recPulse 1s infinite;}
  .stt.err{color:#fff;} .stt.err .sd{background:#fff;animation:none;}

  /* lock screen */
  .lock{position:absolute;inset:0;z-index:60;background:linear-gradient(180deg,var(--orange) 0%,var(--orange-d) 100%);display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px 26px;text-align:center;}
  .lock.on{display:flex;}
  body.device .lock{padding-top:calc(32px + env(safe-area-inset-top));padding-bottom:calc(32px + env(safe-area-inset-bottom));}
  .lock-badge{width:96px;height:96px;border-radius:26px;background:var(--dark);display:flex;align-items:center;justify-content:center;margin-bottom:22px;box-shadow:0 18px 34px -14px rgba(0,0,0,.55);}
  .lock-badge svg{width:52px;height:52px;}
  .lock-title{font-size:20px;font-weight:800;color:var(--dark);line-height:1.15;}
  .lock-sub{font-size:12px;color:rgba(41,41,41,.7);margin-top:8px;line-height:1.5;max-width:280px;}
  .lock-id{font-size:11px;font-weight:700;color:var(--dark);background:rgba(41,41,41,.1);border-radius:999px;padding:5px 12px;margin-top:14px;font-variant-numeric:tabular-nums;}
  .lock-actions{width:100%;max-width:300px;margin-top:26px;display:flex;flex-direction:column;gap:11px;}
  .btn-primary{background:var(--dark);color:var(--white);border:none;border-radius:12px;padding:15px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:9px;}
  .btn-outline{background:transparent;border:1.5px solid var(--dark);color:var(--dark);border-radius:12px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
  .field{width:100%;border:1.5px solid var(--dark);border-radius:12px;padding:14px 15px;font-size:15px;font-family:inherit;font-weight:600;color:var(--dark);background:var(--white);letter-spacing:.06em;text-align:center;}
  .field::placeholder{color:rgba(41,41,41,.4);letter-spacing:0;}
  .lock-note{font-size:10px;color:rgba(41,41,41,.6);margin-top:2px;line-height:1.4;}
  .lock-err{font-size:11px;font-weight:700;color:#7a0000;background:rgba(255,0,0,.14);border-radius:10px;padding:9px 12px;margin-top:4px;display:none;}
  .lock-err.on{display:block;}

  /* small inputs / connect rows */
  .field-sm{width:100%;border:1.5px solid rgba(41,41,41,.4);border-radius:10px;padding:11px 12px;font-size:12px;font-family:inherit;font-weight:600;color:var(--dark);background:var(--white);margin-top:8px;}
  .opt-btn{margin-top:10px;background:var(--dark);color:var(--white);border:none;border-radius:11px;padding:12px 14px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;width:100%;}
  .opt-btn.ghost{background:transparent;border:1.5px solid var(--dark);color:var(--dark);}
  .status-line{font-size:11px;font-weight:700;margin-top:10px;display:flex;align-items:center;gap:7px;color:rgba(41,41,41,.7);}
  .status-line .sdot{width:8px;height:8px;border-radius:50%;background:rgba(41,41,41,.3);}
  .status-line.ok .sdot{background:#1a7f37;}
  .path-row{display:flex;align-items:center;gap:12px;padding:12px 4px;}
  .path-name{font-size:12px;font-weight:600;color:rgba(41,41,41,.7);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hide{display:none!important;}
</style>
</head>
<body>
<div id="stage">
  <div class="phone" id="phone">

    <!-- MAIN -->
    <div class="screen on" id="scr-main">
      <div class="main-pad">
        <div class="pill-sim" id="simPill"><span class="dot" id="simDot"></span>SIM</div>

        <div class="topbar">
          <div class="burger" id="btnMenu"><span></span><span></span><span></span></div>
          <div class="lang-btn" id="btnLangTop"></div>
        </div>

        <div class="cam-wrap">
          <div class="cam">
            <video id="video" muted playsinline autoplay></video>
            <canvas class="sim" id="simCam" width="256" height="256" style="display:none;"></canvas>
            <div class="recring" id="recRing" style="display:none;"></div>
            <div class="prompt" id="camPrompt">
              <div class="cam-icon"><div class="lens"></div><div class="ring"></div><div class="pupil"></div></div>
              <div class="prompt-txt" id="camPromptTxt"></div>
            </div>
          </div>
        </div>

        <div class="timer-wrap">
          <div class="timer"><span class="tnum" id="timeStr">00:00</span><span class="rdot idle" id="recDot"></span></div>
        </div>

        <div class="lower">
          <div class="lower-row">
            <div style="flex:1;min-width:0;">
              <canvas class="viz" id="viz" width="320" height="76"></canvas>
              <div class="label" id="lblLast"></div>
              <div class="stt" id="sttStatus"><span class="sd"></span><span id="sttText"></span></div>
              <div class="interim" id="interim" style="display:none;"></div>
              <div id="mainPhrases"></div>
            </div>
            <div class="ctrls">
              <button class="rec-btn" id="btnRec"><span class="ci" id="recInner"></span></button>
              <button class="mic-btn" id="btnMic">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6 11a6 6 0 0 0 12 0"></path><line x1="12" y1="17" x2="12" y2="21"></line></svg>
              </button>
            </div>
          </div>

  });

  const SIM_PHRASES = {
    es:['Hay alguien aquí','No estoy solo','Sal de este lugar','Te veo','Ayúdame','Frío... mucho frío','¿Quién eres?','Detrás de ti','No tengas miedo','Ellos escuchan','Márchate ahora','Puedo verte'],

  };

    screen:'main', lang:'es',
    recording:false, listening:false, cameraReady:false, camError:'',
    elapsed:0, phrases:[], interim:'',
    settings:Object.assign({}, DEFAULTS),
    sim:false, menuOpen:false, panicOpen:false, licenseOpen:false, toast:'',
    sessionName:'', sessionCount:0,
    locked:true, dirName:''
  };

  // runtime handles
  let stream=null, audioCtx=null, analyser=null, freq=null;
  let recognition=null, recorder=null, chunks=[], recStream=null;
  let timerInt=null, sessionActive=false, toastT=null, simT=null;

  const S = ()=>DICT[state.lang];
  const fmt = sec=>{const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');};
  const tstr = ts=>{const d=new Date(ts);return [d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');};

  /* ---------- camera / audio ---------- */
  function attachStream(){
    const v=$('video');

  }
  function setupAnalyser(st){

      if(!st.getAudioTracks().length) return;
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!audioCtx) audioCtx=new AC();
      if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
      const src=audioCtx.createMediaStreamSource(st);
      analyser=audioCtx.createAnalyser(); analyser.fftSize=128; analyser.smoothingTimeConstant=0.75;

    }catch(e){}
  }

  // Never do it while a recording that exports audio is running — it would silence the video.
  function releaseMic(){
    if(!stream) return;
    if(state.recording && state.settings.exportAudio) return;
    const at=stream.getAudioTracks();
    if(!at.length) return;
    at.forEach(t=>{ try{ t.stop(); }catch(e){} try{ stream.removeTrack(t); }catch(e){} });
    analyser=null; freq=null;
  }
  // wantAudio=false → video-only, leaving the mic FREE for speech recognition.
  // wantAudio=true  → include the mic track (needed when recording with audio export).
  async function ensureCamera(wantAudio){
    if(state.sim) return true;
    const needAudio=!!wantAudio;
    if(stream){
      const hasAudio=stream.getAudioTracks().length>0;
      if(needAudio && hasAudio) return true;
      if(!needAudio){
        // CRITICAL: if a previous recording left the mic captured, release it now,
        // otherwise speech recognition gets no audio and loops "reconnecting".
        if(hasAudio) releaseMic();
        return true;
      }
      // We need audio now but the current stream is video-only: re-acquire.
      try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){}
      stream=null; analyser=null; freq=null;
    }
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{aspectRatio:1,facingMode:'user'},audio:needAudio});

      return true;

      if(needAudio){ // audio may have been blocked; fall back to video-only so preview still works

          state.cameraReady=true; state.camError=''; attachStream(); sync(); return true; }catch(_){}

    }

  /* ---------- speech recognition ---------- */
  let recognizing=false, sttFatal=false, sttFailStreak=0, lastSttErr='';
  function setStt(text, isErr){
    const box=$('sttStatus');

    box.classList.add('on'); box.classList.toggle('err',!!isErr);

    r.onstart=()=>{ recognizing=true; processedFinalIndex=-1; setStt(S().sttListening,false); };
    r.onaudiostart=()=>{ sttFailStreak=0; setStt(S().sttListening,false); };
    r.onresult=e=>{
      sttFailStreak=0;
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res=e.results[i];
        if(res.isFinal){
          if(i>processedFinalIndex){ processedFinalIndex=i; addPhrase(res[0].transcript); }
          // else: same final result re-delivered by the browser — skip, already logged.
        } else interim+=res[0].transcript;
      }
      state.interim=interim.trim(); syncPhrases();
    };
    r.onerror=e=>{
      const err=(e&&e.error)||'';
      lastSttErr=err;
      if(err==='not-allowed'||err==='service-not-allowed'){ sttFatal=true; setStt(S().sttDenied,true); }
      else if(err==='audio-capture'){ sttFailStreak++; setStt(S().sttMicBusy,true); }
      else if(err==='network'){ sttFailStreak++; setStt(S().sttRetry,true); }
      else if(err==='no-speech'){ /* normal silence timeout: NOT a failure */ lastSttErr=''; }
      else if(err==='aborted'){ lastSttErr=''; }
      else { sttFailStreak++; setStt(S().sttError,true); }
    };

      recognizing=false;
      if(!state.listening){ setStt('',false); return; }
      if(sttFatal) return;

        setStt(lastSttErr==='network' ? S().sttNetDown : S().sttMicBusy, true);
        showToast(lastSttErr==='network' ? S().sttNetDown : S().sttMicBusy);
        sttFailStreak=0;
      }
      // Silence timeouts restart immediately and quietly; real errors back off.
      const wasSilence=!lastSttErr;
      const delay=wasSilence ? 120 : Math.min(300*Math.pow(2,sttFailStreak), 3000);
      if(!wasSilence) setStt(S().sttRetry,false);
      setTimeout(()=>{
        if(!state.listening || sttFatal) return;
        releaseMic(); // make sure nothing re-captured the mic while we were down
        lastSttErr='';
        try{ r.start(); }catch(_){}
      }, delay);
    };
    return r;
  }

  async function startListen(){
    beginSession();
    if(state.sim){ state.listening=true; setStt(S().sttListening,false); startSimPhrases(); syncMain(); return; }
    if(!window.isSecureContext){ showToast(S().sttHttps); setStt(S().sttHttps,true); }
    if(!sttSupported()){ showToast(S().sttUnsup); setStt(S().sttUnsup,true); }
    await ensureCamera(false); // video only → mic stays free for recognition
    releaseMic(); // belt & suspenders: never start recognition with the mic captured
    sttFatal=false; sttFailStreak=0; lastSttErr='';
    if(!recognition) recognition=initRecognition();
    if(!recognition){ setStt(S().sttUnsup,true); return; }
    recognition.lang=state.lang==='es'?'es-ES':'en-US';
    state.listening=true; syncMain();
    setStt(S().sttListening,false);
    try{ recognition.start(); }
    catch(e){ /* already started */ try{ recognition.stop(); }catch(_){} setTimeout(()=>{ try{ recognition.start(); }catch(_){} },200); }
  }
  function stopListen(){
    stopSimPhrases();
    state.listening=false; setStt('',false); syncMain(); maybeEndSession();
    if(recognition){ try{ recognition.stop(); }catch(e){} }
  }
  let lastAddedText='', lastAddedAt=0;
  function addPhrase(t){
    t=(t||'').trim(); if(!t) return;
    // Safety net: some browsers occasionally redeliver the same final result
    // right after a recognition restart, which resets our index guard.
    // Ignore an exact repeat of the last phrase if it lands within 1.5s of it.
    const now=Date.now();
    const norm=t.toLowerCase();
    if(norm===lastAddedText && (now-lastAddedAt)<1500) return;
    lastAddedText=norm; lastAddedAt=now;
    state.phrases.unshift({
      id:Date.now()+Math.random(), text:t, ts:Date.now(),
      vts:fmt(state.elapsed), vname:state.sessionName||('VID_'+String(state.sessionCount||1).padStart(4,'0')),
      elapsed:state.elapsed, lang:state.lang
    });
    state.interim=''; syncPhrases(); syncBitacora(); persist();
  }

  /* ---------- session / timer ---------- */
  function startTimer(){ if(timerInt) return; timerInt=setInterval(()=>{state.elapsed++;syncTimer();},1000); }
  function stopTimer(){ clearInterval(timerInt); timerInt=null; }
  function beginSession(){
    if(sessionActive) return;
    sessionActive=true; state.sessionCount++;
    state.sessionName='VID_'+String(state.sessionCount).padStart(4,'0'); state.elapsed=0;
    startTimer(); syncTimer(); persist();
  }
  function maybeEndSession(){ if(!state.recording && !state.listening){ sessionActive=false; stopTimer(); } }

  /* ---------- listen ---------- */
  function startSimPhrases(){
    clearTimeout(simT);
    const tick=()=>{
      if(!state.listening) return;
      const arr=SIM_PHRASES[state.lang];
      addPhrase(arr[Math.floor(Math.random()*arr.length)]);
      simT=setTimeout(tick, 2000+Math.random()*2800);
    };
    simT=setTimeout(tick, 800);
  }
  function stopSimPhrases(){ clearTimeout(simT); simT=null; }

  /* ---------- record ---------- */
  function buildRecStream(){
    if(!stream) return null;
    const tracks=stream.getVideoTracks().slice();
    if(state.settings.exportAudio) stream.getAudioTracks().forEach(t=>tracks.push(t));
    return new MediaStream(tracks);
  }
  async function toggleRecord(){
    if(state.recording){ stopRecording(); return; }
    if(!state.sim){
      // Only grab the mic for the recording if the user wants the audio track.
      // Otherwise keep it video-only so speech recognition keeps the mic and detection works.
      const ok=await ensureCamera(!!state.settings.exportAudio); if(!ok) return;
      try{
        chunks=[]; recStream=buildRecStream();
        const opts={};
        if(MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')) opts.mimeType='video/webm;codecs=vp9,opus';
        else if(MediaRecorder.isTypeSupported('video/webm')) opts.mimeType='video/webm';
        opts.audioBitsPerSecond=state.settings.audioQuality==='128'?128000:96000;
        recorder=new MediaRecorder(recStream,opts);
        recorder.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
        recorder.onstop=finalizeRecording;
        recorder.start();
      }catch(e){}
    }
    startListen();
    state.recording=true; syncMain();
  }
  function stopRecording(){
    const sess=state.sessionName;
    state.recording=false; // set first so finalizeRecording (onstop) is allowed to release the mic
    try{ if(recorder && recorder.state!=='inactive') recorder.stop(); else finalizeRecording(sess); }catch(e){ finalizeRecording(sess); }
    stopListen();
    syncMain(); maybeEndSession();
  }
  async function finalizeRecording(){
    releaseMic(); // free the mic as soon as the recorder is done, so detection keeps working
    const sess=state.sessionName||('VID_'+String(state.sessionCount||1).padStart(4,'0'));
    const g=state.settings;
    const files=[];
    if(!state.sim && chunks.length){
      files.push({name:sess+'.webm', blob:new Blob(chunks,{type:(recorder&&recorder.mimeType)||'video/webm'})});
      chunks=[];
    }
    if(g.exportSubs){
      const srt=buildSrt(sess);
      if(srt) files.push({name:sess+'.srt', blob:new Blob([srt],{type:'application/x-subrip'})});
    }
    if(!files.length){ showToast(S().recSaved); return; }

    if(g.storage==='memory'){ memoryClips.push({name:sess, files}); showToast(S().recMem); return; }

    if(g.storage==='cloud'){
      try{
        if(!cloudConnected()){ showToast(S().cNeedCreds); throw new Error('not-connected'); }
        showToast(S().cUploading);
        if(cloud.provider==='drive') await driveUpload(sess, files);
        else if(cloud.provider==='dropbox') await dropboxUpload(sess, files);
        showToast(S().cUploaded); return;
      }catch(e){
        showToast(S().cUploadFail);
        const zip=await zipFiles(sess, files); download(zip, sess+'.zip'); return;
      }
    }

    // storage === 'device'
    try{
      const h=await fsa.handle();
      if(h && await fsa.ensure(h)){ await fsa.write(h, sess, files); showToast(S().folderSaved+' · '+h.name+'/'+sess); return; }
    }catch(e){}
    const zip=await zipFiles(sess, files); download(zip, sess+'.zip'); showToast(S().zipSaved);
  }
  function buildSrt(sess){
    const items=state.phrases.filter(p=>p.vname===sess).slice().reverse();
    if(!items.length) return '';
    const toStamp=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')+',000';};
    return items.map((p,i)=>{
      const start=p.elapsed||0, end=(items[i+1]?items[i+1].elapsed:start+2);
      return (i+1)+'\n'+toStamp(start)+' --> '+toStamp(Math.max(end,start+1))+'\n'+p.text+'\n';
    }).join('\n');
  }
  function download(blob,name){
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }

  /* ---------- canvas loop ---------- */
  function drawViz(cv,data,t,active){
    const ctx=cv.getContext('2d'),W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
    const bars=42, step=data?Math.floor(data.length/bars):1, bw=W/bars;
    for(let i=0;i<bars;i++){
      let v; if(data){v=data[i*step]/255;} else {v=(Math.sin(i*0.5+t*0.005)+1)/2*0.22+0.05;}
      if(!active) v*=0.25;
      const h=Math.max(2,v*H), a=0.35+v*0.65;
      ctx.fillStyle='rgba(255,255,255,'+a+')';
      const x=i*bw+bw*0.16, w=bw*0.68, y=(H-h)/2, r=Math.min(w/2,2);
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h);
      ctx.fill();
    }
  }
  function drawCam(cv,t){
    const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
    ctx.fillStyle='#20201f'; ctx.fillRect(0,0,W,H);
    const ox=W/2+Math.sin(t*0.0006)*W*0.22, oy=H/2+Math.cos(t*0.0009)*H*0.18;
    const g=ctx.createRadialGradient(ox,oy,4,ox,oy,W*0.34);
    g.addColorStop(0,'rgba(221,145,0,.55)'); g.addColorStop(1,'rgba(221,145,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    for(let i=0;i<130;i++){const x=Math.random()*W,y=Math.random()*H,a=Math.random()*0.18;ctx.fillStyle=Math.random()<0.5?'rgba(255,255,255,'+a+')':'rgba(221,145,0,'+a+')';ctx.fillRect(x,y,1.6,1.6);}
    ctx.fillStyle='rgba(0,0,0,.16)'; for(let y=0;y<H;y+=3){ctx.fillRect(0,y,W,1);}
    ctx.strokeStyle='rgba(255,0,0,.7)'; ctx.lineWidth=2; const c=12;
    ctx.beginPath(); ctx.moveTo(c,c+9); ctx.lineTo(c,c); ctx.lineTo(c+9,c); ctx.moveTo(W-c-9,c); ctx.lineTo(W-c,c); ctx.lineTo(W-c,c+9); ctx.stroke();
  }

  /* ================= IndexedDB kv ================= */
  const idb=(()=>{
    let dbp;
    function open(){ return dbp||(dbp=new Promise((res,rej)=>{
      let r; try{ r=indexedDB.open('fantasma',1); }catch(e){ return rej(e); }
      r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('kv'); }catch(e){} };
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    })); }
    const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{
      const st=db.transaction('kv',mode).objectStore('kv'); const rq=fn(st);
      rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);
    }));
    return {
      get:k=>tx('readonly',s=>s.get(k)).catch(()=>undefined),
      set:(k,v)=>tx('readwrite',s=>s.put(v,k)).catch(()=>{}),
      del:k=>tx('readwrite',s=>s.delete(k)).catch(()=>{})
    };
  })();

  const b64=buf=>{ const b=new Uint8Array(buf); let s=''; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); };
  const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function sha256hex(str){ const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)); return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  function randId(){ const a=crypto.getRandomValues(new Uint8Array(16)); return b64(a).replace(/[^A-Za-z0-9]/g,'').slice(0,22); }

  /* ================= identity + auth (WebAuthn / PIN) ================= */
  let identity=null; // {userId, key, createdAt, cred, pinHash, pinSalt}
  const auth={
    _cached:null,
    // Real check: the API existing is NOT enough — many desktops expose PublicKeyCredential
    // with no fingerprint/face sensor configured. This is what actually caused setup/import
    // to dead-end on desktop: bioAvailable() said "yes" and hid the PIN fields entirely.
    async bioAvailable(){
      if(this._cached!==null) return this._cached;
      try{
        if(!(window.PublicKeyCredential && window.isSecureContext)){ this._cached=false; return false; }
        if(typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable!=='function'){ this._cached=false; return false; }
        this._cached=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
      }catch(e){ this._cached=false; }
      return this._cached;
    },
    async register(userId){
      const challenge=crypto.getRandomValues(new Uint8Array(32));
      const cred=await navigator.credentials.create({publicKey:{
        challenge, rp:{name:'Investigación Fantasma'},
        user:{id:new TextEncoder().encode(userId), name:userId, displayName:userId},
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
        timeout:60000, attestation:'none'
      }});
      return b64(cred.rawId);
    },
    async assert(credB64){
      const challenge=crypto.getRandomValues(new Uint8Array(32));
      await navigator.credentials.get({publicKey:{
        challenge, timeout:60000, userVerification:'required',
        allowCredentials:[{type:'public-key', id:unb64(credB64)}]
      }});
      return true;
    }
  };
  async function loadIdentity(){ identity=await idb.get('identity')||null; return identity; }
  function makeAdfk(id){
    return JSON.stringify({ format:'ADFK', v:1, app:'Investigacion Fantasma',
      userId:id.userId, key:id.key, createdAt:id.createdAt, device:navigator.userAgent }, null, 2);
  }
  function downloadAdfk(id){ download(new Blob([makeAdfk(id)],{type:'application/json'}), id.userId+'.ADFK'); }

  /* ================= ZIP (store, no compression) ================= */
  const crcTable=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
  function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=crcTable[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
  async function zipFiles(folder, files){
    const enc=new TextEncoder(); const parts=[]; const central=[]; let offset=0;
    for(const f of files){
      const name=folder+'/'+f.name;
      const nameBytes=enc.encode(name);
      const data=new Uint8Array(await f.blob.arrayBuffer());
      const crc=crc32(data);
      const lh=new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0,true); lh.setUint16(8,0,true);
      lh.setUint16(10,0,true); lh.setUint16(12,0,true); lh.setUint32(14,crc,true);
      lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
      lh.setUint16(26,nameBytes.length,true); lh.setUint16(28,0,true);
      parts.push(new Uint8Array(lh.buffer), nameBytes, data);
      const ch=new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0,true);
      ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0,true); ch.setUint32(16,crc,true);
      ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,nameBytes.length,true);
      ch.setUint16(30,0,true); ch.setUint16(32,0,true); ch.setUint16(34,0,true); ch.setUint16(36,0,true);
      ch.setUint32(38,0,true); ch.setUint32(42,offset,true);
      central.push({head:new Uint8Array(ch.buffer), name:nameBytes});
      offset+=30+nameBytes.length+data.length;
    }
    const cdStart=offset; let cdSize=0;
    for(const c of central){ parts.push(c.head, c.name); cdSize+=c.head.length+c.name.length; }
    const eocd=new DataView(new ArrayBuffer(22));
    eocd.setUint32(0,0x06054b50,true); eocd.setUint16(8,files.length,true); eocd.setUint16(10,files.length,true);
    eocd.setUint32(12,cdSize,true); eocd.setUint32(16,cdStart,true);
    parts.push(new Uint8Array(eocd.buffer));
    return new Blob(parts,{type:'application/zip'});
  }

  /* ================= File System Access (folder + subfolder per video) ================= */
  const fsa={
    supported(){ return typeof window.showDirectoryPicker==='function'; },
    async choose(){ const h=await window.showDirectoryPicker({mode:'readwrite'}); await idb.set('dirHandle',h); state.dirName=h.name; return h; },
    async handle(){ return idb.get('dirHandle'); },
    async ensure(h){ try{ if((await h.queryPermission({mode:'readwrite'}))==='granted') return true; return (await h.requestPermission({mode:'readwrite'}))==='granted'; }catch(e){ return false; } },
    async write(h, folder, files){
      const sub=await h.getDirectoryHandle(folder,{create:true});
      for(const f of files){ const fh=await sub.getFileHandle(f.name,{create:true}); const w=await fh.createWritable(); await w.write(f.blob); await w.close(); }
    }
  };

  /* ================= Cloud (Google Drive via GIS / Dropbox) ================= */
  const cloud={ provider:'none', driveClientId:'', dropboxKey:'', token:'', driveClient:null };
  async function loadCloud(){ const c=await idb.get('cloud'); if(c) Object.assign(cloud, c, {token:'', driveClient:null}); }
  function saveCloud(){ idb.set('cloud',{provider:cloud.provider, driveClientId:cloud.driveClientId, dropboxKey:cloud.dropboxKey}); }
  function cloudConnected(){ return cloud.provider==='drive' ? !!cloud.driveClientId : cloud.provider==='dropbox' ? !!cloud.token : false; }
  function driveInit(){
    if(!(window.google&&google.accounts&&google.accounts.oauth2)) return false;
    cloud.driveClient=google.accounts.oauth2.initTokenClient({ client_id:cloud.driveClientId, scope:'https://www.googleapis.com/auth/drive.file', callback:()=>{} });
    return true;
  }
  function driveToken(){
    return new Promise((res,rej)=>{
      if(!cloud.driveClient && !driveInit()) return rej(new Error('gis'));
      cloud.driveClient.callback=r=>{ if(r&&r.access_token){ cloud.token=r.access_token; res(r.access_token);} else rej(r||new Error('token')); };
      try{ cloud.driveClient.requestAccessToken({prompt: cloud.token?'':'consent'}); }catch(e){ rej(e); }
    });
  }
  async function driveUpload(folder, files){
    const token=await driveToken();
    const fr=await fetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({name:folder,mimeType:'application/vnd.google-apps.folder'})});
    const fid=(await fr.json()).id;
    for(const f of files){
      const body=new FormData();
      body.append('metadata',new Blob([JSON.stringify({name:f.name,parents:[fid]})],{type:'application/json'}));
      body.append('file',f.blob);
      await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+token},body});
    }
  }
  async function dropboxUpload(folder, files){
    for(const f of files){
      await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{
        Authorization:'Bearer '+cloud.token,
        'Dropbox-API-Arg':JSON.stringify({path:'/'+folder+'/'+f.name,mode:'add',autorename:true,mute:true}),
        'Content-Type':'application/octet-stream'
      },body:f.blob});
    }
  }
  function parseDropboxRedirect(){
    if(location.hash && location.hash.indexOf('access_token=')>=0){
      const p=new URLSearchParams(location.hash.slice(1)); const t=p.get('access_token');
      if(t){ cloud.provider='dropbox'; cloud.token=t; saveCloud(); try{history.replaceState(null,'',location.pathname+location.search);}catch(e){} }
    }
  }

  /* ================= lock screen / auth flow ================= */
  let authMode='unlock', setupIdentity=null;
  let bioKnown=false;           // becomes true once the real async check resolves
  let manualPinOverride=false;  // user explicitly chose "use PIN instead"
  const showEl=el=>el.classList.remove('hide'), hideEl=el=>el.classList.add('hide');
  function lockErr(msg){ const e=$('lockErr'); if(msg){e.textContent=msg;e.classList.add('on');}else e.classList.remove('on'); }
  function useBioNow(){ return auth._cached===true && !manualPinOverride; }
  function renderLock(){
    const s=S(); lockErr('');
    const p1=$('pinInput'), p2=$('pinInput2'), note=$('lockNote'), lid=$('lockId'), sw=$('btnSwitchMethod');
    p1.value=''; p2.value='';
    const unlock = identity && authMode!=='register';
    if(unlock){
      $('lockTitle').textContent=s.lockUnlockTitle;
      $('lockSub').textContent=s.lockUnlockSub;
      lid.textContent=identity.userId; showEl(lid);
      if(identity.pinHash && manualPinOverride || (identity.pinHash && !identity.cred)){
        showEl(p1); p1.placeholder=s.phPinEnter; hideEl(p2); hideEl(note); $('btnPrimaryAuth').textContent=s.btnEnter;
      } else {
        hideEl(p1); hideEl(p2); hideEl(note); $('btnPrimaryAuth').textContent=s.btnUnlockBio;
      }
      sw.style.display='none'; // recovery on this identity is via "Import .ADFK" below, not a method switch
    } else {
      $('lockTitle').textContent=s.lockCreateTitle;
      $('lockSub').textContent = (setupIdentity&&setupIdentity.imported) ? s.idImported : s.lockCreateSub;
      hideEl(lid);
      const bio = useBioNow();
      if(bio){ hideEl(p1); hideEl(p2); showEl(note); note.textContent=s.noteBio; }
      else { showEl(p1); p1.placeholder=s.phPinNew; showEl(p2); p2.placeholder=s.phPinRepeat; showEl(note); note.textContent=s.notePin; }
      $('btnPrimaryAuth').textContent=s.btnCreate;
      // Manual escape hatch: always let the user switch method themselves,
      // regardless of what device detection thinks — this is what guarantees
      // setup never dead-ends on a desktop without a working sensor.
      if(auth._cached===true){ sw.style.display='block'; sw.textContent = bio ? s.usePin : s.useBio; }
      else { sw.style.display='none'; }
    }
    $('btnImportId').textContent=s.btnImport;
  }
  function refreshBioThenRender(){
    auth.bioAvailable().then(()=>{ bioKnown=true; renderLock(); });
  }
  function showLock(){ state.locked=true; $('lockScreen').classList.add('on'); renderLock(); refreshBioThenRender(); }
  function enterApp(){ state.locked=false; $('lockScreen').classList.remove('on'); sync(); }
  function startRegister(imported){
    authMode='register'; manualPinOverride=false;
    setupIdentity = imported || { userId:'USR-'+randId().slice(0,8).toUpperCase(), key:randId()+randId(), createdAt:Date.now(), imported:false };
    renderLock();
  }
  function toggleMethod(){ manualPinOverride=!manualPinOverride; lockErr(''); renderLock(); }
  async function doSetup(){
    const s=S();
    if(!setupIdentity) startRegister(null);
    let rec;
    if(useBioNow()){
      try{
        const cred=await auth.register(setupIdentity.userId);
        rec={userId:setupIdentity.userId,key:setupIdentity.key,createdAt:setupIdentity.createdAt,cred,pinHash:null,pinSalt:null};
      }catch(e){
        // Graceful fallback — never dead-end: drop to PIN setup right away instead of
        // leaving the user stuck with only an error and a biometric button that won't work.
        auth._cached=false; manualPinOverride=true;
        lockErr(s.errAuthFallback); renderLock(); return;
      }
    } else {
      const a=$('pinInput').value.trim(), b=$('pinInput2').value.trim();
      if(a.length<4){ lockErr(s.errPinShort); return; }
      if(a!==b){ lockErr(s.errPinMismatch); return; }
      const salt=randId(); const h=await sha256hex(salt+a);
      rec={userId:setupIdentity.userId,key:setupIdentity.key,createdAt:setupIdentity.createdAt,cred:null,pinHash:h,pinSalt:salt};
    }
    identity=rec; await idb.set('identity',identity);
    downloadAdfk(identity);
    showToast(setupIdentity.imported? s.idImported : s.idCreated);
    setupIdentity=null; authMode='unlock'; manualPinOverride=false;
    enterApp();
    setTimeout(()=>showToast(S().adfkSaved),1200);
  }
  async function doUnlock(){
    const s=S();
    const wantBio = identity.cred && !(identity.pinHash && manualPinOverride);
    if(wantBio){
      try{ await auth.assert(identity.cred); enterApp(); }
      catch(e){
        lockErr(identity.pinHash ? s.errAuth : s.errAuthNoFallback);
      }
    } else if(identity.pinHash){
      const a=$('pinInput').value.trim();
      const h=await sha256hex(identity.pinSalt+a);
      if(h===identity.pinHash) enterApp(); else lockErr(s.errPinWrong);
    } else { enterApp(); }
  }
  function primaryAuth(){ (identity && authMode!=='register') ? doUnlock() : doSetup(); }
  function lockNow(){
    if(state.recording) stopRecording(); else stopListen();
    state.menuOpen=false; authMode='unlock'; setupIdentity=null;
    showLock(); sync(); showToast(S().locked);
  }
  function exportIdentity(){ if(identity){ downloadAdfk(identity); showToast(S().adfkSaved); } }
  function importAdfkFile(file){
    const r=new FileReader();
    r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(d && d.format==='ADFK' && d.userId && d.key){
        startRegister({userId:d.userId,key:d.key,createdAt:d.createdAt||Date.now(),imported:true});
      } else lockErr(S().errImport);
    }catch(e){ lockErr(S().errImport); } };
    r.readAsText(file);
  }

  /* ================= cloud connect ================= */
  async function cloudConnect(){
    const s=S();
    if(cloud.provider==='none') return;
    if(cloudConnected()){ cloud.token=''; syncVideoExtras(); return; }
    const val=($('cloudCredInput').value||'').trim();
    if(cloud.provider==='drive'){
      if(!val){ showToast(s.cNeedCreds); return; }
      cloud.driveClientId=val; saveCloud();
      if(!(window.google&&google.accounts&&google.accounts.oauth2)){ showToast(s.cConnFail); return; }
      try{ await driveToken(); showToast(s.cConnected); }catch(e){ showToast(s.cConnFail); }
      syncVideoExtras();
    } else if(cloud.provider==='dropbox'){
      if(!val){ showToast(s.cNeedCreds); return; }
      cloud.dropboxKey=val; saveCloud();
      const redirect=location.origin+location.pathname;
      location.href='https://www.dropbox.com/oauth2/authorize?response_type=token&client_id='+encodeURIComponent(val)+'&redirect_uri='+encodeURIComponent(redirect);
    }
  }
  async function chooseFolder(){
    const s=S();
    if(!fsa.supported()){ showToast(s.vFolderUnsup); return; }
    try{ const h=await fsa.choose(); showToast(h.name); syncVideoExtras(); }catch(e){}
  }
  function syncVideoExtras(){
    const s=S(), g=state.settings;
    $('pathSection').classList.toggle('hide', g.storage!=='device');
    $('cloudSection').classList.toggle('hide', g.storage!=='cloud');
    // path
    $('pathName').textContent = state.dirName ? state.dirName+'/' : (fsa.supported()? s.vFolderNone : s.vFolderUnsup);
    $('btnChooseFolder').textContent=s.vChooseFolder;
    // cloud radios
    document.querySelectorAll('.opt[data-cloud]').forEach(el=>el.classList.toggle('sel', el.dataset.cloud===cloud.provider));
    const showCreds = cloud.provider!=='none';
    $('cloudCreds').classList.toggle('hide', !showCreds);
    if(showCreds){
      const inp=$('cloudCredInput');
      if(document.activeElement!==inp){ inp.value = cloud.provider==='drive'?cloud.driveClientId:cloud.dropboxKey; }
      inp.placeholder = cloud.provider==='drive'? s.phDriveId : s.phDropboxKey;
      $('btnCloudConnect').textContent = cloudConnected()? s.cDisconnect : s.cConnect;
      const st=$('cloudStatus'); st.classList.toggle('ok',cloudConnected());
      $('cloudStatusText').textContent = cloudConnected()? s.cConnected : s.cDisconnected;
    }
  }

  /* ---------- persistence ---------- */
  const STORE_KEY='fantasma_state_v1';
  function persist(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({
        lang:state.lang, settings:state.settings, phrases:state.phrases, sessionCount:state.sessionCount
      }));
    }catch(e){}
  }
  function loadPersisted(){
    try{
      const raw=localStorage.getItem(STORE_KEY); if(!raw) return;
      const d=JSON.parse(raw);
      if(d.lang==='es'||d.lang==='en') state.lang=d.lang;
      if(d.settings) state.settings=Object.assign({}, DEFAULTS, d.settings);
      if(Array.isArray(d.phrases)) state.phrases=d.phrases;
      if(typeof d.sessionCount==='number') state.sessionCount=d.sessionCount;
    }catch(e){}
  }

  /* ---------- device / responsive ---------- */
  function isStandalone(){
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
           (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) ||
           window.navigator.standalone===true;
  }
  function fit(){
    const stage=$('stage');
    const deviceMode = isStandalone() || Math.min(window.innerWidth, window.innerHeight) <= 480;
    document.body.classList.toggle('device', deviceMode);
    if(deviceMode){
      stage.style.transform='none';
    }else{
      const pad=16;
      const sc=Math.min(1,(window.innerWidth-pad*2)/390,(window.innerHeight-pad*2)/844);
      stage.style.transform='scale('+sc+')';
    }
  }
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',fit);
  if(window.matchMedia){ try{ window.matchMedia('(display-mode: standalone)').addEventListener('change',fit); }catch(e){} }

  /* ---------- service worker ---------- */
  function registerSW(){
    if(!('serviceWorker' in navigator)) return;
    if(location.protocol!=='http:' && location.protocol!=='https:') return; // needs a server, not file://
    // Auto-reload once when a new service worker takes over, so a fresh deploy
    // is never masked by a stale cached copy — this is what caused the login
    // screen to appear missing after an update. Guarded to fire only once per tab.
    let reloadedForUpdate=false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(reloadedForUpdate) return; reloadedForUpdate=true;
      try{ if(sessionStorage.getItem('fantasma_sw_reloaded')==='1') return; sessionStorage.setItem('fantasma_sw_reloaded','1'); }catch(e){}
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.update().catch(()=>{});
    }).catch(()=>{});
  }

  /* ---------- boot ---------- */
  async function boot(){
    loadPersisted();
    try{ await loadCloud(); }catch(e){}
    parseDropboxRedirect();
    try{ const h=await fsa.handle(); if(h) state.dirName=h.name; }catch(e){}
    try{ await loadIdentity(); }catch(e){}
    document.documentElement.lang=state.lang;
    authMode = identity ? 'unlock' : 'register';
    if(!identity) startRegister(null);
    sync(); fit();
    showLock();
    registerSW();
    requestAnimationFrame(loop);
  }
  boot();
})();
</script>
</body>
</html>
